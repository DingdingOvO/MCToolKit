<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MCToolKit</title>
  <script>
    // GitHub Pages SPA redirect: preserve the path segment after /MCToolKit/
    // and redirect to index.html so React Router can handle it.
    var seg = location.pathname.replace(/^\/MCToolKit\/?/, '');
    if (seg) {
      window.location.replace(
        '/MCToolKit/?' + encodeURIComponent(seg)
      );
    } else {
      window.location.replace('/MCToolKit/');
    }
  </script>
</head>
<body></body>
</html>
